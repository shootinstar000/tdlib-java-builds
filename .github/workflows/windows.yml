name: Windows
on:
  create:
    tags:
      - v*-windows
jobs:
  windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v2
      with:
        fetch-depth: 1
    - name: Install gperf
      run: choco install gperf -y
    - name: Build tdlib for windows
      shell: bash
      run: bash windows.sh
